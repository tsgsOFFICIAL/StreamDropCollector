name: Nightly Build

on:
    push:
        branches: [master]

jobs:
    check:
        runs-on: ubuntu-latest
        outputs:
            skip: ${{ steps.tagcheck.outputs.skip }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Skip if commit is tagged for release
              id: tagcheck
              run: |
                  if git tag --points-at "${{ github.sha }}" | grep -q '^v'; then
                      echo "skip=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "skip=false" >> "$GITHUB_OUTPUT"
                  fi

    build:
        needs: check
        if: needs.check.outputs.skip != 'true'
        runs-on: windows-latest
        permissions:
            contents: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "10.0.x"

            - name: Set nightly version
              id: vars
              run: |
                  $sha = "${{ github.sha }}".Substring(0, 7)
                  [xml]$xml = Get-Content UI/UI.csproj
                  $baseVersion = $xml.Project.PropertyGroup.FileVersion | Select-Object -First 1
                  if (-not $baseVersion) { $baseVersion = "1.0.0" }
                  $nightlyVersion = "$baseVersion-nightly.$sha"
                  echo "sha_short=$sha" >> $env:GITHUB_OUTPUT
                  echo "base_version=$baseVersion" >> $env:GITHUB_OUTPUT
                  echo "nightly_version=$nightlyVersion" >> $env:GITHUB_OUTPUT

            - name: Publish (Self-Contained)
              run: >
                  dotnet publish UI/UI.csproj
                  -c Release
                  -r win-x64
                  -p:SelfContained=true
                  -p:FileVersion=${{ steps.vars.outputs.base_version }}
                  -p:InformationalVersion=${{ steps.vars.outputs.nightly_version }}
                  -p:IncludeSourceRevisionInInformationalVersion=false
                  -o publish/self-contained/

            - name: Publish (Framework-Dependent)
              run: >
                  dotnet publish UI/UI.csproj
                  -c Release
                  -r win-x64
                  -p:SelfContained=false
                  -p:FileVersion=${{ steps.vars.outputs.base_version }}
                  -p:InformationalVersion=${{ steps.vars.outputs.nightly_version }}
                  -p:IncludeSourceRevisionInInformationalVersion=false
                  -o publish/framework-dependent/

            - name: Zip (Self-Contained)
              run: Compress-Archive -Path publish/self-contained/* -DestinationPath StreamDropCollector-nightly-self-contained.zip

            - name: Zip (Framework-Dependent)
              run: Compress-Archive -Path publish/framework-dependent/* -DestinationPath StreamDropCollector-nightly-framework-dependent.zip

            - name: Install Inno Setup
              run: choco install innosetup -y --no-progress

            - name: Build installer
              run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" Installer\StreamDropCollector.iss'

            - name: Delete existing nightly release
              run: gh release delete nightly --yes --cleanup-tag
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              continue-on-error: true

            - name: Create nightly release
              shell: pwsh
              run: |
                  $installer = Get-ChildItem "publish/installer/*.exe" | Select-Object -First 1 -ExpandProperty FullName
                  gh release create nightly `
                    "StreamDropCollector-nightly-self-contained.zip" `
                    "StreamDropCollector-nightly-framework-dependent.zip" `
                    "$installer" `
                    --title "Nightly Build (${{ steps.vars.outputs.nightly_version }})" `
                    --notes "Automated build from commit ${{ steps.vars.outputs.sha_short }} on master." `
                    --prerelease
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Update last-build badge
              shell: pwsh
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  $message = "${{ steps.vars.outputs.nightly_version }} · $(Get-Date -AsUTC -Format 'yyyy-MM-dd HH:mm') UTC"
                  $json = @{ schemaVersion = 1; label = "last build"; message = $message; color = "orange" } | ConvertTo-Json -Compress
                  $url = "https://x-access-token:$env:GH_TOKEN@github.com/${{ github.repository }}.git"
                  git clone --depth 1 --branch badges $url badges-branch
                  if ($LASTEXITCODE -ne 0) {
                    git init badges-branch
                    git -C badges-branch checkout --orphan badges
                    git -C badges-branch remote add origin $url
                  }
                  Set-Content -Path badges-branch/latest-build.json -Value $json -Encoding utf8NoBOM
                  git -C badges-branch add latest-build.json
                  git -C badges-branch -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update last-build badge" --allow-empty
                  git -C badges-branch push origin badges
